<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="ciel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#051f33"/>
      <stop offset=".55" stop-color="#082C46"/>
      <stop offset="1" stop-color="#0d5a7e"/>
    </linearGradient>
    <linearGradient id="mer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f6f8c"/>
      <stop offset=".35" stop-color="#0a5677"/>
      <stop offset="1" stop-color="#063B5C"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#A9DDEB" stop-opacity=".55"/>
      <stop offset=".45" stop-color="#55C9D0" stop-opacity=".18"/>
      <stop offset="1" stop-color="#55C9D0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="reflet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A9DDEB" stop-opacity=".5"/>
      <stop offset="1" stop-color="#A9DDEB" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="voile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4FAFC"/>
      <stop offset="1" stop-color="#d3ebf2"/>
    </linearGradient>
  </defs>

  <!-- Ciel -->
