    <circle cx="1540" cy="190" r="1.3" opacity=".5"/><circle cx="1330" cy="40" r="1.2" opacity=".5"/>
    <circle cx="560" cy="250" r="1.2" opacity=".4"/><circle cx="1480" cy="300" r="1.4" opacity=".4"/>
