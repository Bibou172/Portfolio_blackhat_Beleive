<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" preserveAspectRatio="xMidYMid slice">
  <!-- Illustration originale de l'écran de chargement : coucher de soleil synthwave sur la côte. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0b3a"/>
      <stop offset="0.35" stop-color="#5a1a72"/>
      <stop offset="0.6" stop-color="#d42f7f"/>
      <stop offset="0.78" stop-color="#ff9f45"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="0.55" stop-color="#ff9f45"/>
      <stop offset="1" stop-color="#ff3d8b"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b1d6e"/>
      <stop offset="1" stop-color="#0e0820"/>
    </linearGradient>
    <clipPath id="sunClip">
      <rect x="0" y="0" width="1200" height="290"/>
      <rect x="0" y="296" width="1200" height="14"/>
      <rect x="0" y="318" width="1200" height="12"/>
      <rect x="0" y="340" width="1200" height="9"/>
      <rect x="0" y="360" width="1200" height="7"/>
      <rect x="0" y="378" width="1200" height="5"/>
    </clipPath>
  </defs>
  <rect width="1200" height="675" fill="url(#sky)"/>
  <circle cx="600" cy="330" r="190" fill="url(#sun)" clip-path="url(#sunClip)"/>
  <rect y="400" width="1200" height="275" fill="url(#sea)"/>
  <g fill="#ff9f45" opacity="0.55">
    <rect x="470" y="416" width="260" height="4" rx="2"/>
    <rect x="500" y="436" width="200" height="4" rx="2"/>
    <rect x="530" y="458" width="140" height="3" rx="2"/>
    <rect x="560" y="482" width="80" height="3" rx="2"/>
  </g>
  <image href="skyline.svg" x="0" y="300" width="400" height="100"/>
  <image href="skyline.svg" x="800" y="300" width="400" height="100"/>
  <image href="palm.svg" x="40" y="250" width="200" height="320"/>
  <image href="palm.svg" x="960" y="280" width="180" height="290"/>
  <rect y="560" width="1200" height="115" fill="#0e0820"/>
  <rect y="560" width="1200" height="3" fill="#ff3d8b"/>
</svg>
